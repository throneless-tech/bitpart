name: Build test image

on:
  workflow_run:
    workflows: ["Run checks"]
    branches: [develop]
    types: 
      - completed

env:
  IMAGE_NAME: bitpart
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  release_version:
    runs-on: ubuntu-latest
    name: "Build test image"
    steps:
      - name: Check out
        id: check_out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH_NAME }}
      - name: Set timestamp
        id: set_timestamp
        run: echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
      - name: Buildah Action
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: develop-${{ github.sha }}-${{ env.TIMESTAMP}}
          containerfiles: |
            ./Dockerfile
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        env:
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust
