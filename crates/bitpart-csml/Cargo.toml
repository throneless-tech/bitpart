[package]
name = "bitpart-csml"
version = "1.11.2"
authors = [
    "Alexis Merelo <alexis.merelo@clevy.io>",
    "François Falala-Sechet <francois@clevy.io>",
    "Bastien Botella <bastien@clevy.io>",
    "Jefferson Le Quellec <jefferson.le-quellec@clevy.io>",
    "Josh King <josh@throneless.tech>"
]
description = """
This is the Bitpart fork of the CSML Interpreter, the interpreter for the CSML programming language, a DSL designed to make it extremely easy to create rich and powerful chatbots.
"""
homepage = "https://bitp.art"
keywords = ["chatbot", "programming-language", "csml"]
categories = ["text-processing"]
readme = "README.md"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "bitpart_csml"
crate-type = ["rlib"]

[dependencies]
async-trait = "0.1"
nom_locate = "4.0.0"
nom =  "7.1"
rand = "0.8"
jsonwebtoken = "8.1"
chrono = "0.4"
chrono-tz = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.8.23"
serde-xml-rs = "0.5.1"
html-escape = "0.2.11"
quickxml_to_serde = {version = "0.5.0" }
phf = { version = "0.10.1", features = ["macros"]}
regex = "1.5.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
urlencoding = "2.1"
url = "2.2.2"

lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1-rustls-tls"] }

typetag = "0.1"
bincode = "1.3.3"
base64 = "0.13.0"
hex = "0.4.3"
digest = "0.10"
md-5 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
uuid = { version = "1.1.2", features = ["serde", "v4", "v1"] }
log = "0.4.14"
env_logger= "0.9.0"

[dev-dependencies]
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
rcgen = "0.12"
